<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErieTracker</title>
<link rel="stylesheet" href="body.css">
  </head>
<style>
.card {
  background-color: yellow;      /* the yellow part */
  padding: 20px;                 /* space inside */
  border-radius: 12px;           /* smooth corners */
  box-shadow: 0 4px 10px rgba(0,0,0,0.2); /* card shadow */
  width: 250px;
  font-family: sans-serif;
}
</style>
<body>
  <h1>ErieTracker Warnings</h1>
   <style>
.warning-card {
  padding: 16px;
  margin: 10px 0;
  border-radius: 10px;
  border-left: 6px solid;
  font-family: Arial, sans-serif;
  background: #fff;
}

.warning-card h3 {
  margin: 0 0 6px;
}

.warning-card p {
  margin: 0;
  line-height: 1.4;
}

.warning {
  border-color: #d32f2f;
  background: #fff1f1;
}

.advisory {
  border-color: #f59e0b;
  background: #fff8e1;
}
</style>
<div class="search-box">
  <input type="text" placeholder="Search warnings...">
</div>
<style>
.search-box input {
  width: 300px;
  padding: 12px 18px;
  font-size: 16px;
  border: none;
  border-radius: 25px;
  background: #f1f1f1;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  outline: none;
}
</style>
<div class="warning-card warning">
  <h3>🌊 High Waves</h3>
  <p>Waves may build to 5–8 feet, with occasional waves around 10 feet in western Lake Erie.</p>
</div>
<div class="warning-card advisory">
  <h3>🌧️ Showers</h3>
  <p>Scattered showers may reduce visibility and make conditions more difficult on Lake Erie.</p>
</div>
<p>Brought to you by ErieTracker</p>
  <footer>
  <h6>Copyright © 2026 ErieTracker</h6>
  </footer>
</body>
</html>
